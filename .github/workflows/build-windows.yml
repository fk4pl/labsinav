# Windows .exe derlemesi. Sonuç: Actions → bu çalıştırma → Artifacts
#   LabSinav-Egitmen (zip)  ve  LabSinav-Ogrenci (zip)
name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:  # Actions sekmesinden "Run workflow" ile elle çalıştırma

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      # Windows'a özgü bir test hatası olsa bile .exe'ler derlensin (hata raporda görünür).
      - name: Testler (pytest)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Eğitmen uygulamasını derle
        run: pyinstaller --noconfirm build_tools/LabSinav-Egitmen.spec

      - name: Öğrenci uygulamasını derle
        run: pyinstaller --noconfirm build_tools/LabSinav-Ogrenci.spec

      # Exe'ler açılıp hemen çıkabiliyor mu? (eksik modül / Qt eklentisi / veri dosyası yakalanır)
      # Başarısızsa derleme başarısız sayılır.
      - name: Duman testi
        timeout-minutes: 5
        shell: pwsh
        run: |
          foreach ($app in "LabSinav-Egitmen", "LabSinav-Ogrenci") {
            $exe = "dist\$app\$app.exe"
            $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
            Write-Host "$app çıkış kodu: $($process.ExitCode)"
            if ($process.ExitCode -ne 0) {
              Get-ChildItem "$env:LOCALAPPDATA\LabSinav\logs" -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 50 }
              exit 1
            }
          }

      # Klasör doğrudan yüklenir; GitHub indirirken kendisi .zip yapar (zip içinde zip olmasın).
      - uses: actions/upload-artifact@v4
        with:
          name: LabSinav-Egitmen
          path: dist/LabSinav-Egitmen/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: LabSinav-Ogrenci
          path: dist/LabSinav-Ogrenci/
          if-no-files-found: error
